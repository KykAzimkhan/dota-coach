name: Dota Coach

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может запускать с задержкой)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: dota-coach
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check matches and answer Telegram
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python dota_coach.py --once

      - name: Save state and analyses
        run: |
          git config user.name "dota-coach-bot"
          git config user.email "dota-coach-bot@users.noreply.github.com"
          git add state.json analyses
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "coach: state update"
          git pull --rebase
          git push
